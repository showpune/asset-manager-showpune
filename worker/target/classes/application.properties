# Azure Blob Storage Configuration
# Set azure.storage.account-endpoint to your storage account blob endpoint, e.g.:
#   https://<storage-account-name>.blob.core.windows.net
# Authentication uses DefaultAzureCredential (Managed Identity when deployed to Azure)
azure.storage.account-endpoint=https://<storage-account-name>.blob.core.windows.net
azure.storage.container-name=assets

# Server port (different from web module)
server.port=8081

# Application name
spring.application.name=assets-manager-worker

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/assets_manager
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect