# AWS S3 Configuration
aws.accessKeyId=your-access-key-Id
aws.secretKey=your-secret-key
aws.region=us-east-1
aws.s3.bucket=your-bucket-name

# Server port (different from web module)
server.port=8081

# Application name
spring.application.name=assets-manager-worker

# Azure Service Bus Configuration (test values)
spring.cloud.azure.credential.managed-identity-enabled=false
spring.cloud.azure.credential.client-id=test-client-id
spring.cloud.azure.servicebus.entity-type=queue
spring.cloud.azure.servicebus.namespace=test-namespace.servicebus.windows.net

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect