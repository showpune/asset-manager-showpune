# AWS S3 Configuration
aws.accessKeyId=your-access-key-Id
aws.secretKey=your-secret-key
aws.region=us-east-1
aws.s3.bucket=your-bucket-name

# Azure Blob Storage Configuration (used when azure profile is active)
azure.storage.account-endpoint=https://your-storage-account.blob.core.windows.net
azure.storage.container-name=images

# Azure Service Bus Configuration (used when azure profile is active)
azure.servicebus.namespace=your-namespace
azure.servicebus.queue-name=image-processing

# Server port (different from web module)
server.port=8081

# Application name
spring.application.name=assets-manager-worker

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/assets_manager
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect