# Azure Blob Storage Configuration
azure.storage.blob.endpoint=https://your-storage-account.blob.core.windows.net
azure.storage.blob.container-name=assets

# Server port (different from web module)
server.port=8081

# Application name
spring.application.name=assets-manager-worker

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Azure Service Bus JMS Configuration
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID}
spring.jms.servicebus.pricing-tier=standard
spring.jms.servicebus.namespace=${SERVICE_BUS_NAMESPACE}
spring.jms.servicebus.passwordless-enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://${AZURE_POSTGRESQL_HOST}:5432/assets_manager?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
spring.datasource.username=${AZURE_MI_NAME}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect