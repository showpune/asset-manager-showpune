spring.profiles.active=dev

# Azure Service Bus disabled for tests
spring.cloud.azure.servicebus.enabled=false
spring.cloud.azure.credential.managed-identity-enabled=false

# AWS S3 Configuration (dummy values for tests)
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket

# Azure Storage Configuration (dummy values for tests)
azure.storage.account-name=test-storage-account
azure.storage.container-name=test-container
azure.storage.endpoint=https://test-storage-account.blob.core.windows.net

# Local storage for tests
local.storage.directory=../storage-test

# RabbitMQ for tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# In-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB