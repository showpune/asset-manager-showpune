# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Azure Blob Storage test configuration
azure.storage.blob.endpoint=https://test.blob.core.windows.net
azure.storage.blob.container=test-container

# Azure Service Bus JMS test configuration
spring.jms.servicebus.namespace=test-namespace
spring.jms.servicebus.passwordless-enabled=true
spring.jms.servicebus.pricing-tier=premium
spring.cloud.azure.credential.managed-identity-enabled=false
spring.jms.listener.auto-startup=false
