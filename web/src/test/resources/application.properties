spring.application.name=assets-manager

# AWS S3 Configuration
aws.accessKey=your-access-key
aws.secretKey=your-secret-key
aws.region=us-east-1
aws.s3.bucket=your-bucket-name

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Azure Service Bus Configuration (test values)
spring.cloud.azure.credential.managed-identity-enabled=false
spring.cloud.azure.credential.client-id=test-client-id
spring.cloud.azure.servicebus.entity-type=queue
spring.cloud.azure.servicebus.namespace=test-namespace.servicebus.windows.net

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true