# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Azure Blob Storage (not used in unit tests - dev profile active)
azure.storage.account-endpoint=https://test.blob.core.windows.net
azure.storage.container-name=test-assets

# Azure Service Bus JMS (not used in unit tests - mock ConnectionFactory provided via TestJmsConfig)
spring.jms.servicebus.namespace=test-namespace
spring.jms.servicebus.pricing-tier=standard
spring.jms.servicebus.passwordless-enabled=false
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.jms.ServiceBusJmsAutoConfiguration
