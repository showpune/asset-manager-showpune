# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy Azure Blob Storage credentials for test context
azure.storage.blob.endpoint=https://test-account.blob.core.windows.net
azure.storage.blob.container-name=test-container

# Azure Service Bus JMS test configuration (disabled for tests)
spring.cloud.azure.credential.managed-identity-enabled=false
spring.cloud.azure.credential.client-id=test-client-id
spring.jms.servicebus.pricing-tier=premium
spring.jms.servicebus.namespace=test-namespace
spring.jms.servicebus.passwordless-enabled=false
spring.jms.servicebus.connection-string=Endpoint=sb://test-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=dGVzdA==
