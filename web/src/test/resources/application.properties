# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy AWS credentials for test context
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket

# Azure Service Bus Configuration (test values)
spring.cloud.azure.credential.managed-identity-enabled=false
spring.jms.servicebus.connection-string=Endpoint=sb://test.servicebus.windows.net/;SharedAccessKeyName=test;SharedAccessKey=test
spring.cloud.azure.servicebus.entity-type=queue
spring.jms.servicebus.pricing-tier=premium
spring.profiles.active=dev
