# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Azure Key Vault for tests
spring.cloud.azure.keyvault.secret.property-source-enabled=false

# Dummy Azure credentials for test context
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=test-account;AccountKey=dGVzdC1rZXk=;EndpointSuffix=core.windows.net
azure.storage.container-name=test-container

# Test storage mount path (uses storage directory in project root for testing)
storage.mount.path=../storage

# Disable Azure Service Bus for tests
spring.jms.servicebus.enabled=false
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.jms.ServiceBusJmsAutoConfiguration
