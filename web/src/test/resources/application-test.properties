# Test configuration for Azure Service Bus
spring.cloud.azure.credential.managed-identity-enabled=false
spring.cloud.azure.credential.client-id=test-client-id
spring.cloud.azure.servicebus.entity-type=queue
spring.cloud.azure.servicebus.namespace=test-namespace

# Disable auto-configuration for tests that we don't need
spring.autoconfigure.exclude=\
  com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusAutoConfiguration,\
  com.azure.spring.messaging.servicebus.implementation.AzureServiceBusMessagingAutoConfiguration

# Database Configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop