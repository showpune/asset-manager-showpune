# Test configuration for Azure Service Bus
# Disable Azure Service Bus for tests to avoid requiring actual Azure resources
spring.cloud.azure.servicebus.enabled=false

# Keep the database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable AWS for tests
aws.accessKey=test-key
aws.secretKey=test-secret
aws.region=us-east-1
aws.s3.bucket=test-bucket