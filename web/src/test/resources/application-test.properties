# Test configuration for Azure Service Bus migration
# Disable Azure Service Bus auto-configuration for testing
spring.cloud.azure.servicebus.enabled=false
spring.cloud.azure.auto-configure-enabled=false

# Test AWS S3 Configuration
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket-name

# Test Database Configuration  
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect