# Test configuration - disable Azure Service Bus for testing
spring.cloud.azure.servicebus.enabled=false

# Disable auto-configuration for Azure Service Bus during testing
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusAutoConfiguration

# AWS S3 Configuration for testing
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket-name

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true