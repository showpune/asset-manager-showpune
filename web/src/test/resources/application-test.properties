# Test configuration for Azure Service Bus migration
# Override Azure Service Bus properties for testing
spring.cloud.azure.credential.managed-identity-enabled=false
spring.cloud.azure.servicebus.entity-type=queue
spring.cloud.azure.servicebus.namespace=test-namespace

# Mock credentials for testing
AZURE_CLIENT_ID=test-client-id
SERVICE_BUS_NAMESPACE=test-namespace

# Test AWS S3 Configuration
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket-name

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect