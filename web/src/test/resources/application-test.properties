# Test configuration to disable Azure Service Bus auto-configuration
spring.cloud.azure.servicebus.enabled=false
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusAutoConfiguration,com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusMessagingAutoConfiguration

# Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop