# Test application properties
spring.application.name=assets-manager-test

# Disable Azure Service Bus auto-configuration for tests
spring.cloud.azure.credential.managed-identity-enabled=false
spring.cloud.azure.servicebus.enabled=false

# Use in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable AWS S3 for tests  
aws.accessKey=test-key
aws.secretKey=test-secret
aws.region=us-east-1
aws.s3.bucket=test-bucket

# Local storage for tests
local.storage.directory=../test-storage