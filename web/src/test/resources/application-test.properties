# Test configuration for Azure Service Bus
spring.cloud.azure.servicebus.enabled=false
spring.cloud.azure.credential.managed-identity-enabled=false

# Exclude Azure autoconfiguration in tests
spring.autoconfigure.exclude=\
    com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusAutoConfiguration

# Database Configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop