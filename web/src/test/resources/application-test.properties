spring.application.name=assets-manager-test

# Disable Azure Service Bus for tests
spring.cloud.azure.servicebus.enabled=false
spring.cloud.azure.credential.managed-identity-enabled=false

# Use in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# AWS S3 Configuration (dummy values for tests)
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket-name

# Local storage for tests
local.storage.directory=/tmp/test-storage