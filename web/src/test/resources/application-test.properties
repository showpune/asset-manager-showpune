# Test configuration
spring.application.name=assets-manager-test

# Disable Azure Service Bus for tests
spring.cloud.azure.servicebus.enabled=false

# Test database configuration (in-memory H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test file storage
local.storage.directory=/tmp/test-storage

# AWS credentials for tests (placeholders)
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket