# Test configuration - minimal setup
spring.application.name=assets-manager-test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Disable RabbitMQ for tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
management.health.rabbit.enabled=false

# Local file storage settings 
local.storage.directory=../storage

# Azure Storage Configuration (placeholder for tests)
azure.storage.account.endpoint=https://test.blob.core.windows.net
azure.storage.container.name=test-container