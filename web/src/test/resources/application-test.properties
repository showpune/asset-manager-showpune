spring.application.name=assets-manager-test

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Disable Azure Service Bus autoconfiguration for tests
spring.autoconfigure.exclude=\
  com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusAutoConfiguration,\
  com.azure.spring.cloud.autoconfigure.implementation.servicebus.AzureServiceBusMessagingAutoConfiguration,\
  com.azure.spring.messaging.servicebus.implementation.autoconfigure.ServiceBusMessagingAutoConfiguration

# Database Configuration (in-memory for tests)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Local storage for tests
local.storage.directory=./target/test-storage