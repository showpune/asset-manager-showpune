spring.application.name=assets-manager

# Azure Blob Storage Configuration (with managed identity)
azure.storage.account-name=your-storage-account-name
azure.storage.container-name=assets

# Azure Service Bus Configuration (with managed identity)
spring.cloud.azure.servicebus.namespace=your-servicebus-namespace
spring.cloud.azure.servicebus.credential.managed-identity-enabled=true
azure.servicebus.queue-name=image-processing-queue

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration (Azure PostgreSQL with managed identity)
# For production, use Azure Key Vault references instead of plaintext passwords:
# spring.datasource.password=${key-vault-reference}
# See: https://docs.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
spring.datasource.url=jdbc:postgresql://your-postgresql-server.postgres.database.azure.com:5432/assets_manager
spring.datasource.username=your-admin-username
spring.datasource.password=your-admin-password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JMS Configuration for Azure Service Bus
spring.jms.listener.acknowledge-mode=client
spring.jms.listener.auto-startup=true
