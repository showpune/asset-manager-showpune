spring.application.name=assets-manager

# Azure Blob Storage Configuration
azure.storage.blob.endpoint=https://your-storage-account.blob.core.windows.net
azure.storage.blob.container-name=assets

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Azure Service Bus JMS Configuration
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID}
spring.jms.servicebus.pricing-tier=premium
spring.jms.servicebus.namespace=${SERVICE_BUS_NAMESPACE}
spring.jms.servicebus.passwordless-enabled=true

# Database Configuration - Azure Database for PostgreSQL with Managed Identity
# Required env vars: POSTGRESQL_HOST (server name without domain), POSTGRESQL_DATABASE, POSTGRESQL_USER (managed identity display name)
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_HOST}.postgres.database.azure.com:5432/${POSTGRESQL_DATABASE:assets_manager}?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
spring.datasource.username=${POSTGRESQL_USER}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
