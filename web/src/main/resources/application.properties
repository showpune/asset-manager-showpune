spring.application.name=assets-manager

# Azure Blob Storage Configuration
# Set azure.storage.account-endpoint to your storage account blob endpoint, e.g.:
#   https://<storage-account-name>.blob.core.windows.net
# Authentication uses DefaultAzureCredential (Managed Identity when deployed to Azure)
azure.storage.account-endpoint=https://<storage-account-name>.blob.core.windows.net
azure.storage.container-name=assets

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Azure Service Bus JMS Configuration
# Authentication uses Managed Identity (credential-free when deployed to Azure)
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID:}
spring.jms.servicebus.namespace=${SERVICE_BUS_NAMESPACE:<servicebus-namespace>}
spring.jms.servicebus.pricing-tier=standard
spring.jms.servicebus.passwordless-enabled=true

# Database Configuration – Azure Database for PostgreSQL with Managed Identity
# Set AZURE_POSTGRESQL_HOST to your server FQDN, e.g. assetmgr-dev-pg-<suffix>.postgres.database.azure.com
# Set AZURE_POSTGRESQL_DATABASE to your database name (default: assetsdb)
# Set AZURE_POSTGRESQL_USERNAME to the managed identity display name (used as the PostgreSQL user)
spring.datasource.url=jdbc:postgresql://${AZURE_POSTGRESQL_HOST:<server>.postgres.database.azure.com}:5432/${AZURE_POSTGRESQL_DATABASE:assetsdb}?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
spring.datasource.username=${AZURE_POSTGRESQL_USERNAME:<managed-identity-name>}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
