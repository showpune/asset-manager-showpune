spring.application.name=assets-manager

# Azure Blob Storage Configuration
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=your-account-name;AccountKey=your-account-key;EndpointSuffix=core.windows.net
azure.storage.container-name=your-container-name

# Mounted Storage Configuration (Azure Storage File Share or local directory)
# For Azure Container Apps with mounted Azure Storage File Share: /mnt/azure-storage
# For local development: ../storage
storage.mount.path=${STORAGE_MOUNT_PATH:../storage}

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Azure Service Bus Configuration
spring.jms.servicebus.connection-string=Endpoint=sb://your-servicebus-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=your-key
spring.jms.servicebus.pricing-tier=standard

# Database Configuration - Azure Database for PostgreSQL with Passwordless Authentication
spring.datasource.url=jdbc:postgresql://${AZURE_POSTGRESQL_HOST:your-postgresql-server.postgres.database.azure.com}:${AZURE_POSTGRESQL_PORT:5432}/${AZURE_POSTGRESQL_DATABASE:assets_manager}?sslmode=require
spring.datasource.username=${AZURE_POSTGRESQL_USERNAME:your-managed-identity-username}
spring.datasource.azure.passwordless-enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
