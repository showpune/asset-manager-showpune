# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Azure Blob Storage configuration for tests
azure.storage.blob.endpoint=https://test-account.blob.core.windows.net
azure.storage.blob.container-name=test-container

# Exclude Service Bus JMS auto-configuration in tests
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.jms.ServiceBusJmsAutoConfiguration
