# Test configuration for in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Azure Blob Storage configuration for tests
azure.storage.account-name=test-storage-account
azure.storage.container-name=test-container

# Disable Azure Service Bus JMS auto-configuration for tests (use embedded ActiveMQ instead)
spring.jms.servicebus.enabled=false
